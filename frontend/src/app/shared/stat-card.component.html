<div class="stat-card" [class.loading]="loading">
  <div class="stat-icon" [style.background-color]="cardLightColor">
    <svg *ngIf="!loading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <ng-container [ngSwitch]="icon">
        <path *ngSwitchCase="'users'" d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle *ngSwitchCase="'users'" cx="9" cy="7" r="4"/>
        <path *ngSwitchCase="'briefcase'" d="M20 7h-9a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
        <path *ngSwitchCase="'briefcase'" d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
        <path *ngSwitchCase="'file-text'" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline *ngSwitchCase="'file-text'" points="14 2 14 8 20 8"/>
        <path *ngSwitchCase="'check-circle'" d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline *ngSwitchCase="'check-circle'" points="22 4 12 14.01 9 11.01"/>
        <path *ngSwitchCase="'trending-up'" d="M23 6l-9.5 9.5-5-5L1 18"/>
        <path *ngSwitchCase="'trending-up'" d="M17 6h6v6"/>
        <path *ngSwitchCase="'user'" d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle *ngSwitchCase="'user'" cx="12" cy="7" r="4"/>
        <path *ngSwitchCase="'zap'" d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        <circle *ngSwitchDefault cx="12" cy="12" r="10"/>
      </ng-container>
    </svg>
    <svg *ngIf="loading" class="animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
    </svg>
  </div>
  <div class="stat-content">
    <span class="stat-label">{{ label }}</span>
    <span class="stat-value" *ngIf="!loading">{{ value }}</span>
    <span class="stat-value skeleton" *ngIf="loading">&nbsp;</span>
    <div class="stat-trend" *ngIf="trend && !loading">
      <span class="trend-icon" [style.color]="trendColor">{{ trendIcon }}</span>
      <span class="trend-value" [style.color]="trendColor">{{ trendValue }}%</span>
    </div>
  </div>
</div>
