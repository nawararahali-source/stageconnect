<div class="notification-toast" [class.show]="show" [class.type-success]="type === 'success'" [class.type-error]="type === 'error'" [class.type-warning]="type === 'warning'" [class.type-info]="type === 'info'">
  <div class="toast-content">
    <div class="toast-icon" [style.background-color]="bgColor" [style.color]="textColor">
      {{ icon }}
    </div>
    <div class="toast-message">
      <span class="toast-title" *ngIf="title">{{ title }}</span>
      <span class="toast-text">{{ message }}</span>
    </div>
    <button class="toast-close" type="button" (click)="onClose()" aria-label="Fermer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>
</div>
