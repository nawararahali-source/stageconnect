<aside 
  class="sidebar"
  [class.collapsed]="isCollapsed"
  [class.mobile]="isMobile"
>
  <!-- Logo -->
  <div class="sidebar-header">
    <a routerLink="/dashboard" class="brand" aria-label="StageConnect AI">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <span class="brand-text" *ngIf="!isCollapsed">StageConnect <span class="brand-accent">AI</span></span>
    </a>
    <button 
      class="collapse-btn" 
      type="button" 
      (click)="onToggle()"
      aria-label="Toggle sidebar"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    <div class="nav-section">
      <span class="nav-label" *ngIf="!isCollapsed">Menu principal</span>
      <a 
        *ngFor="let item of filteredItems"
        class="nav-item"
        [routerLink]="item.link"
        [fragment]="item.fragment"
        routerLinkActive="active"
        [attr.aria-label]="item.label"
        (click)="onItemClick()"
      >
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <ng-container [ngSwitch]="item.icon">
              <path *ngSwitchCase="'home'" d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <path *ngSwitchCase="'user'" d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle *ngSwitchCase="'user'" cx="12" cy="7" r="4"/>
              <path *ngSwitchCase="'zap'" d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
              <rect *ngSwitchCase="'briefcase'" x="2" y="7" width="20" height="14" rx="2" ry="2"/>
              <path *ngSwitchCase="'briefcase'" d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
              <path *ngSwitchCase="'file-text'" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline *ngSwitchCase="'file-text'" points="14 2 14 8 20 8"/>
              <line *ngSwitchCase="'file-text'" x1="16" y1="13" x2="8" y2="13"/>
              <line *ngSwitchCase="'file-text'" x1="16" y1="17" x2="8" y2="17"/>
              <line *ngSwitchCase="'send'" x1="22" y1="2" x2="11" y2="13"/>
              <polygon *ngSwitchCase="'send'" points="22 2 15 22 11 13 2 9 22 2"/>
              <path *ngSwitchCase="'users'" d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle *ngSwitchCase="'users'" cx="9" cy="7" r="4"/>
              <path *ngSwitchCase="'users'" d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path *ngSwitchCase="'users'" d="M16 3.13a4 4 0 0 1 0 7.75"/>
              <path *ngSwitchCase="'message'" d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5z"/>
            </ng-container>
          </svg>
        </div>
        <span class="nav-text" *ngIf="!isCollapsed">{{ item.label }}</span>
        <span class="nav-badge" *ngIf="item.badge && !isCollapsed">{{ item.badge }}</span>
      </a>
    </div>
  </nav>

  <!-- User Section -->
  <div class="sidebar-footer">
    <div class="user-profile" *ngIf="!isCollapsed">
      <div class="user-avatar">
        <img *ngIf="userAvatar" [src]="userAvatar" [alt]="userName" />
        <span *ngIf="!userAvatar" class="avatar-initials">{{ initials }}</span>
      </div>
      <div class="user-info">
        <span class="user-name">{{ userName }}</span>
        <span class="user-role">{{ userRole === 'student' ? 'Étudiant' : 'Entreprise' }}</span>
      </div>
    </div>
    <button class="logout-btn" type="button" (click)="onLogout()" aria-label="Déconnexion">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span *ngIf="!isCollapsed">Déconnexion</span>
    </button>
  </div>
</aside>

<!-- Mobile Overlay -->
<div 
  class="sidebar-overlay"
  *ngIf="isMobile && !isCollapsed"
  (click)="onToggle()"
></div>
