# Environnement de TEST : utilise les images publiees sur GHCR (pas de build)
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: stageconnect
    networks: [stageconnect]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  ml-service:
    image: ghcr.io/nawararahali-source/stageconnect-ml-service:${IMAGE_TAG}
    ports:
      - "8001:8001"
    networks: [stageconnect]

  backend:
    image: ghcr.io/nawararahali-source/stageconnect-backend:${IMAGE_TAG}
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_VERSION: ${IMAGE_TAG}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: stageconnect
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      ML_SERVICE_URL: http://ml-service:8001
    ports:
      - "8000:8000"
    networks: [stageconnect]

  frontend:
    image: ghcr.io/nawararahali-source/stageconnect-frontend:${IMAGE_TAG}
    depends_on:
      - backend
    ports:
      - "4200:80"
    networks: [stageconnect]

networks:
  stageconnect: