services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-stageconnect}
    volumes:
      - db_data:/var/lib/mysql
    networks: [stageconnect]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  ml-service:
    build: ./ml-service
    ports:
      - "8001:8001"
    networks: [stageconnect]

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-stageconnect}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      ML_SERVICE_URL: http://ml-service:8001
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/var/www/html/storage
    networks: [stageconnect]

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "4200:80"
    networks: [stageconnect]

volumes:
  db_data:
  backend_storage:

networks:
  stageconnect: