name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    name: Backend Laravel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: stageconnect_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      # base de test jetable, ces valeurs ne sont pas des secrets
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: stageconnect_test
      DB_USERNAME: root
      DB_PASSWORD: root
      APP_DEBUG: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, pdo_mysql, bcmath
          coverage: pcov

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparer la configuration de test
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrations
        run: php artisan migrate --force

      - name: Tests PHPUnit avec couverture
        run: |
          mkdir -p reports
          vendor/bin/phpunit --log-junit reports/junit.xml --coverage-clover reports/coverage.xml

      - name: Archiver les rapports de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-backend
          path: backend/reports

  frontend:
    name: Frontend Angular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Build
        run: npm run build

      - name: Archiver le build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  ml-service:
    name: ML service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          pip install pytest httpx2

      - name: Tests
        run: pytest -v

  security:
    name: Security (Gitleaks + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (détection de secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      # Vulnérabilités connues restantes : laravel/framework 9.x (fin de vie,
      # correctifs uniquement en 10+) et fruitcake/laravel-cors (abandonné).
      # Justification détaillée dans le rapport (Lot 5). Le rapport est archivé.
      - name: Composer audit
        working-directory: backend
        continue-on-error: true
        run: composer audit --locked --no-interaction 2>&1 | tee composer-audit.txt

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm audit (niveau high)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high 2>&1 | tee npm-audit.txt

      - name: Archiver les rapports de sécurité
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-securite
          path: |
            backend/composer-audit.txt
            frontend/npm-audit.txt

  docker:
    name: Docker (build + publication GHCR)
    runs-on: ubuntu-latest
    needs: [backend, frontend, ml-service, security, lint]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend, ml-service]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-test:
    name: Deploiement en test + smoke tests
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: test
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version et configuration de test (jetable)
        run: |
          echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          DBPW=$(openssl rand -hex 16)
          APPKEY="base64:$(openssl rand -base64 32)"
          echo "::add-mask::$DBPW"
          echo "::add-mask::$APPKEY"
          echo "DB_PASSWORD=$DBPW" >> "$GITHUB_ENV"
          echo "APP_KEY=$APPKEY" >> "$GITHUB_ENV"

      - name: Deployer les images publiees
        run: |
          docker compose -f docker-compose.test.yml pull
          docker compose -f docker-compose.test.yml up -d

      - name: Smoke tests et health check
        run: |
          sed -i 's/\r$//' scripts/smoke-test.sh
          EXPECTED_VERSION="$IMAGE_TAG" bash scripts/smoke-test.sh

      - name: Logs des conteneurs (en cas d'echec)
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color

      - name: Trace de la version deployee
        if: success()
        run: |
          echo "### Deploiement en test" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version deployee : \`$IMAGE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit : \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Smoke tests : OK" >> "$GITHUB_STEP_SUMMARY"

      - name: Arreter l'environnement de test
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  lint:
    name: Lint et analyse statique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, pdo_mysql, bcmath

      - name: Installer les dépendances PHP
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      # Analyse statique PHP : bloquante (quality gate)
      - name: PHPStan (niveau 0)
        working-directory: backend
        run: vendor/bin/phpstan analyse app --level=0 --no-progress

      # Style PHP : rapport (dette de style connue, voir bilan)
      - name: Laravel Pint (rapport)
        working-directory: backend
        shell: bash
        continue-on-error: true
        run: vendor/bin/pint --test 2>&1 | tee pint-report.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances Node
        working-directory: frontend
        run: npm ci

      # Lint Angular : rapport (33 erreurs connues, correction progressive)
      - name: ESLint Angular (rapport)
        working-directory: frontend
        shell: bash
        continue-on-error: true
        run: npm run lint 2>&1 | tee eslint-report.txt

      - name: Archiver les rapports de lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-lint
          path: |
            backend/pint-report.txt
            frontend/eslint-report.txt